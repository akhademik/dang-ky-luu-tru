name: Scheduled Daily Auto-Checkout

on:
  schedule:
    # 05:01 UTC = 12:01 GMT+7 (Asia/Ho_Chi_Minh) trưa mỗi ngày
    - cron: '1 5 * * *'
  # Cho phép kích hoạt thủ công từ GitHub Actions UI bởi quản trị viên repo
  workflow_dispatch:
    inputs:
      force:
        description: 'Ép buộc checkout (true / false)'
        required: false
        default: 'false'

# Ràng buộc quyền tối thiểu (Least Privilege) - Tuyệt đối không cấp quyền ghi repo
permissions:
  contents: read

# Ngăn chặn nhiều workflow chạy đồng thời
concurrency:
  group: auto-checkout-cron
  cancel-in-progress: false

jobs:
  auto_checkout:
    name: Execute Auto-Checkout at 12:01 GMT+7
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Auto-Checkout API
        env:
          # Secret được inject qua biến môi trường an toàn (tự động masked bởi GitHub runner)
          CRON_SECRET: ${{ secrets.APP_PASSWORD || secrets.CRON_SECRET_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://dang-ky-luu-tru.pages.dev' }}
          FORCE_CHECKOUT: ${{ github.event.inputs.force || 'false' }}
        run: |
          # 1. Kiểm tra cấu hình secret (tuyệt đối không echo secret ra console)
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Thiếu secret APP_PASSWORD trong GitHub Secrets! Vui lòng cấu hình tại Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 2. Chuẩn hóa & kiểm tra an toàn input force
          FORCE_FLAG="false"
          if [ "$FORCE_CHECKOUT" = "true" ]; then
            FORCE_FLAG="true"
          fi

          TARGET_URL="${APP_URL%/}/api/stays/auto-checkout"
          echo "📡 Đang kích hoạt tự động checkout qua Cloudflare Edge (UTC $(date -u '+%Y-%m-%d %H:%M:%S'))"

          # 3. Tạo file phản hồi tạm thời
          TMP_RESP=$(mktemp)

          # 4. Gọi API với curl bảo mật & retry chống lỗi mạng thoáng qua:
          # -s: Silent mode (không hiển thị thanh tiến trình)
          # -S: Chỉ in thông báo lỗi chuẩn nếu có sự cố
          # --retry 3 --retry-all-errors --max-time 60: Tự động retry tối đa 3 lần nếu gặp sự cố mạng
          # Tuyệt đối không dùng cờ -v để tránh in header chứa secret ra logs
          HTTP_CODE=$(curl -s -S --retry 3 --retry-all-errors --max-time 60 -w "%{http_code}" -o "$TMP_RESP" \
            -X POST "$TARGET_URL" \
            -H "X-Cron-Key: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"force\": $FORCE_FLAG}" || echo "FAILED")

          # 5. Đánh giá kết quả trả về an toàn
          if [ "$HTTP_CODE" = "200" ]; then
            # Kiểm tra nếu hệ thống đang ở chế độ DEV thì cảnh báo và fail
            SKIPPED=$(jq -r '.skipped // false' "$TMP_RESP" 2>/dev/null || echo "false")
            if [ "$SKIPPED" = "true" ]; then
              MSG=$(jq -r '.message // "Bị bỏ qua do ở chế độ DEV"' "$TMP_RESP" 2>/dev/null)
              echo "::error::Auto-checkout bị bỏ qua vì Cloudflare đang ở chế độ DEV: $MSG"
              rm -f "$TMP_RESP"
              exit 1
            fi

            echo "✅ Kích hoạt Auto-Checkout thành công! (HTTP 200)"
            echo "📊 Kết quả: Hoàn tất kiểm tra và xử lý các lượt lưu trú hết hạn."
            rm -f "$TMP_RESP"
            exit 0
          else
            echo "::error::Gọi API Auto-Checkout thất bại với mã HTTP: $HTTP_CODE"
            ERR_MSG=$(jq -r '.message // .error // "Unknown error"' "$TMP_RESP" 2>/dev/null || echo "Không nhận được phản hồi hợp lệ")
            echo "Chi tiết: $ERR_MSG"
            rm -f "$TMP_RESP"
            exit 1
          fi
